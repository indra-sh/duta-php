name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.1", laravel: "10.*", testbench: "8.*" }
          - { php: "8.2", laravel: "11.*", testbench: "9.*" }
          - { php: "8.3", laravel: "12.*", testbench: "10.*" }
          - { php: "8.4", laravel: "12.*", testbench: "10.*" }
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --with-all-dependencies
      - name: Test
        run: vendor/bin/phpunit
