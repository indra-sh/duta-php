name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  core:
    # The SDK itself on the oldest PHP it supports, without Laravel.
    name: PHP 8.1, no Laravel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
      - name: Install
        run: |
          composer remove orchestra/testbench --dev --no-update --no-interaction
          composer require "phpunit/phpunit:^10.5" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction
      - name: Test
        run: vendor/bin/phpunit --testsuite core

  laravel:
    # Laravel releases still receiving security fixes. Composer refuses to
    # install older ones, since every release of them has an open advisory.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.3", laravel: "12.*", testbench: "10.*" }
          - { php: "8.4", laravel: "13.*", testbench: "11.*" }
          - { php: "8.5", laravel: "13.*", testbench: "11.*" }
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --with-all-dependencies
      - name: Test
        run: vendor/bin/phpunit
